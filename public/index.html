<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsa Movie Night</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <header class="bg-[#0A192F] shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 onclick="switchView('customer')" class="text-3xl font-bold cursor-pointer"><span class="text-white">Samsa</span> <span class="text-amber-400">Movie Night</span></h1>
      <button onclick="switchView('admin')" class="text-sm bg-gray-800 px-3 py-1 rounded border border-gray-600 hover:bg-gray-700 transition">Admin Area</button>
    </div>
  </header>

  <main id="customerView" class="container mx-auto px-4 py-8 hidden">
    <h2 class="text-2xl font-bold mb-6">Now Showing</h2>
    <div id="moviesList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <main id="adminView" class="container mx-auto px-4 py-8 hidden">
    <div class="max-w-4xl mx-auto">
      <h2 class="text-3xl font-bold text-amber-400 mb-6">Admin Dashboard</h2>
      <div id="adminLogin" class="bg-[#1F2937] p-6 rounded-xl border border-gray-700 hidden">
        <h3 class="text-xl font-bold mb-4">Enter Admin Password</h3>
        <input type="password" id="adminPassword" placeholder="Password" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-600 text-white">
        <button onclick="loginAdmin()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-lg">Login</button>
      </div>
      <div id="adminControls" class="hidden space-y-6">
        <div class="flex justify-between items-center">
          <div class="space-x-2">
            <button onclick="showAdminTab('forms')" id="tabFormsBtn" class="bg-gray-800 px-4 py-2 rounded border border-amber-400 text-amber-400">Manage Movies</button>
            <button onclick="showAdminTab('bookings')" id="tabBookingsBtn" class="bg-gray-800 px-4 py-2 rounded border border-gray-600 text-gray-300">View Bookings</button>
          </div>
          <button onclick="logoutAdmin()" class="text-red-400 hover:text-red-300 text-sm">Logout</button>
        </div>
        <div id="adminForms" class="space-y-6">
          <div class="bg-[#1F2937] p-6 rounded-xl border border-gray-700">
            <h3 class="text-xl font-bold mb-4">Add New Movie</h3>
            <input type="text" id="mTitle" placeholder="Movie Title (e.g. Deadpool)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <input type="text" id="mPoster" placeholder="Poster URL (Optional)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <input type="text" id="mGenre" placeholder="Genre (e.g. Action)" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <button onclick="addMovie()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg">Save Movie</button>
          </div>
          <div class="bg-[#1F2937] p-6 rounded-xl border border-gray-700">
            <h3 class="text-xl font-bold mb-4">Add Showtime</h3>
            <select id="sMovieId" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white"><option value="">Select a Movie</option></select>
            <input type="text" id="sDate" placeholder="Date (e.g. Friday, Nov 15)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <input type="text" id="sTime" placeholder="Time (e.g. 7:00 PM)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <input type="number" id="sPrice" placeholder="Price (XAF)" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <button onclick="addShowtime()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded-lg">Save Showtime</button>
          </div>
        </div>
        <div id="adminBookings" class="hidden space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="text-xl font-bold">Recent Bookings</h3>
            <button onclick="loadBookings()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded">Refresh</button>
          </div>
          <div id="bookingsList" class="space-y-3"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="showtimeModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
    <div class="bg-[#1F2937] border border-gray-700 rounded-xl max-w-md w-full p-6 relative">
      <button onclick="closeModal('showtimeModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      <h3 id="modalMovieTitle" class="text-2xl font-bold mb-4"></h3>
      <div id="modalShowtimesList" class="space-y-3"></div>
    </div>
  </div>

  <div id="seatModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
    <div class="bg-[#1F2937] border border-gray-700 rounded-xl max-w-2xl w-full p-6 relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal('seatModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      <h3 id="seatModalTitle" class="text-2xl font-bold mb-1">Select Seats</h3>
      <p id="seatModalPrice" class="text-amber-400 mb-6"></p>
      <div class="w-full h-2 bg-gray-600 rounded mb-8"></div>
      <p class="text-center text-xs text-gray-400 mb-4">SCREEN</p>
      <div id="seatGrid" class="grid grid-cols-10 gap-2 mb-8 justify-center"></div>
      <div class="bg-gray-800 p-4 rounded-lg mb-4 border border-gray-600">
        <h4 class="font-bold mb-2">Your Details</h4>
        <input type="text" id="custName" placeholder="Full Name" class="w-full mb-2 p-2 bg-gray-900 rounded border border-gray-600 text-white">
        <input type="email" id="custEmail" placeholder="Email Address" class="w-full mb-2 p-2 bg-gray-900 rounded border border-gray-600 text-white">
        <input type="tel" id="custPhone" placeholder="MTN/Orange Number" class="w-full mb-2 p-2 bg-gray-900 rounded border border-gray-600 text-white">
      </div>
      <div class="flex justify-between items-center border-t border-gray-700 pt-4 mb-4">
        <div><p class="text-gray-400 text-sm">Selected Seats:</p><p id="selectedSeatsText" class="font-bold text-lg">None</p></div>
        <div class="text-right"><p class="text-gray-400 text-sm">Total:</p><p id="totalPriceText" class="font-bold text-xl text-amber-400">0 XAF</p></div>
      </div>
      <button id="payBtn" onclick="payWithCamerPay()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-lg transition">Pay with Mobile Money</button>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    let adminPass = localStorage.getItem('samsaAdminPass');
    let currentShowtimeId = null;
    let currentPrice = 0;
    let selectedSeats = [];

    // --- CHECK IF RETURNING FROM PAYMENT ---
    window.addEventListener('load', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const bookingId = urlParams.get('booking');
      
      if (bookingId) {
        // We just returned from CamerPay!
        try {
          const res = await axios.get(`${API_URL}/payments/verify/${bookingId}`);
          if (res.data.status === 'success') {
            alert('🎉 Payment Successful! Your tickets are confirmed.');
            window.history.replaceState({}, document.title, "/"); // Clear the URL
            window.location.reload(); // Reload to show the seat as booked
            return; // Stop execution here
          } else {
            alert('❌ Payment was not completed.');
            window.history.replaceState({}, document.title, "/");
          }
        } catch (err) {
          alert('Error verifying payment.');
        }
      }

      // Normal load routing
      if (window.location.hash === '#admin') switchView('admin');
      else switchView('customer');
    });

    function switchView(view) {
      if (view === 'admin') {
        window.location.hash = 'admin';
        document.getElementById('customerView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        if (adminPass) {
          document.getElementById('adminLogin').classList.add('hidden');
          document.getElementById('adminControls').classList.remove('hidden');
          showAdminTab('forms');
          loadAdminData();
        } else {
          document.getElementById('adminLogin').classList.remove('hidden');
          document.getElementById('adminControls').classList.add('hidden');
        }
      } else {
        window.location.hash = '';
        document.getElementById('adminView').classList.add('hidden');
        document.getElementById('customerView').classList.remove('hidden');
        loadMovies();
      }
    }

    function showAdminTab(tab) {
      const formsTab = document.getElementById('adminForms');
      const bookingsTab = document.getElementById('adminBookings');
      const formsBtn = document.getElementById('tabFormsBtn');
      const bookingsBtn = document.getElementById('tabBookingsBtn');
      if (tab === 'forms') {
        formsTab.classList.remove('hidden');
        bookingsTab.classList.add('hidden');
        formsBtn.className = "bg-gray-800 px-4 py-2 rounded border border-amber-400 text-amber-400";
        bookingsBtn.className = "bg-gray-800 px-4 py-2 rounded border border-gray-600 text-gray-300";
      } else {
        formsTab.classList.add('hidden');
        bookingsTab.classList.remove('hidden');
        formsBtn.className = "bg-gray-800 px-4 py-2 rounded border border-gray-600 text-gray-300";
        bookingsBtn.className = "bg-gray-800 px-4 py-2 rounded border border-amber-400 text-amber-400";
        loadBookings();
      }
    }

    async function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (!pass) return alert('Enter password');
      localStorage.removeItem('samsaAdminPass');
      try {
        await axios.get(`${API_URL}/admin/bookings`, { headers: { Authorization: pass } });
        adminPass = pass;
        localStorage.setItem('samsaAdminPass', adminPass);
        document.getElementById('adminPassword').value = '';
        switchView('admin'); 
      } catch (err) {
        alert('Incorrect Password! Check the Render logs to see what the server expected.');
      }
    }

    function logoutAdmin() {
      localStorage.removeItem('samsaAdminPass');
      adminPass = null;
      switchView('admin');
    }

    async function loadAdminData() {
      try {
        const res = await axios.get(`${API_URL}/movies`);
        const movies = res.data;
        const select = document.getElementById('sMovieId');
        select.innerHTML = '<option value="">Select a Movie</option>' + movies.map(m => `<option value="${m._id}">${m.title}</option>`).join('');
      } catch (err) { console.log(err); }
    }

    async function loadBookings() {
      const container = document.getElementById('bookingsList');
      container.innerHTML = '<p class="text-gray-400">Loading...</p>';
      try {
        const res = await axios.get(`${API_URL}/admin/bookings`, { headers: { Authorization: adminPass } });
        const bookings = res.data;
        if (bookings.length === 0) {
          container.innerHTML = '<p class="text-gray-400">No bookings yet.</p>';
          return;
        }
        container.innerHTML = bookings.map(b => {
          const movieTitle = b.showtimeId?.movieId?.title || 'Unknown Movie';
          const statusColor = b.status === 'paid' ? 'text-green-400' : 'text-red-400';
          const date = new Date(b.createdAt).toLocaleDateString();
          return `
            <div class="bg-[#1F2937] p-4 rounded-lg border border-gray-700">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h4 class="font-bold text-lg">${movieTitle}</h4>
                  <p class="text-sm text-gray-400">Booked on ${date}</p>
                </div>
                <span class="font-bold ${statusColor} uppercase">${b.status}</span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-sm text-gray-300">
                <p><strong>Name:</strong> ${b.customerName}</p>
                <p><strong>Phone:</strong> ${b.customerPhone}</p>
                <p><strong>Seats:</strong> ${b.seats.join(', ')}</p>
                <p><strong>Amount:</strong> ${b.totalAmountXAF} XAF</p>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p class="text-red-400">Error loading bookings. Check password.</p>';
      }
    }

    async function addMovie() {
      const title = document.getElementById('mTitle').value;
      const posterUrl = document.getElementById('mPoster').value;
      const genre = document.getElementById('mGenre').value;
      if (!title) return alert('Title is required');
      try {
        await axios.post(`${API_URL}/admin/movies`, { title, posterUrl, genre }, { headers: { Authorization: adminPass } });
        alert('Movie added successfully!');
        document.getElementById('mTitle').value = '';
        document.getElementById('mPoster').value = '';
        document.getElementById('mGenre').value = '';
        loadAdminData();
      } catch (err) { alert('Error: Wrong password or server issue.'); }
    }

    async function addShowtime() {
      const movieId = document.getElementById('sMovieId').value;
      const date = document.getElementById('sDate').value;
      const time = document.getElementById('sTime').value;
      const priceGHS = document.getElementById('sPrice').value;
      if (!movieId || !date || !time || !priceGHS) return alert('Fill all fields');
      try {
        await axios.post(`${API_URL}/admin/showtimes`, { movieId, date, time, priceGHS }, { headers: { Authorization: adminPass } });
        alert('Showtime added successfully!');
        document.getElementById('sDate').value = '';
        document.getElementById('sTime').value = '';
        document.getElementById('sPrice').value = '';
      } catch (err) { alert('Error: Wrong password or server issue.'); }
    }

    async function loadMovies() {
      const container = document.getElementById('moviesList');
      try {
        const res = await axios.get(`${API_URL}/movies`);
        const movies = res.data;
        if (movies.length === 0) { container.innerHTML = `<p class="text-gray-400">No movies yet.</p>`; return; }
        container.innerHTML = movies.map(movie => `
          <div onclick="openShowtimes('${movie._id}', '${movie.title}')" class="bg-[#1F2937] rounded-xl overflow-hidden border border-gray-700 cursor-pointer hover:border-amber-400 transition">
            ${movie.posterUrl ? `<img src="${movie.posterUrl}" class="w-full h-64 object-cover">` : `<div class="w-full h-64 bg-gray-800 flex items-center justify-center text-gray-500">No Poster</div>`}
            <div class="p-4"><h3 class="font-bold text-lg">${movie.title}</h3><p class="text-gray-400 text-sm">${movie.genre || ''}</p></div>
          </div>
        `).join('');
      } catch (err) { container.innerHTML = `<p class="text-red-400">Error loading movies.</p>`; }
    }

    async function openShowtimes(movieId, movieTitle) {
      document.getElementById('modalMovieTitle').innerText = movieTitle;
      const list = document.getElementById('modalShowtimesList');
      list.innerHTML = '<p class="text-gray-400">Loading...</p>';
      openModal('showtimeModal');
      try {
        const res = await axios.get(`${API_URL}/movies/${movieId}/showtimes`);
        if (res.data.length === 0) { list.innerHTML = '<p class="text-gray-400">No showtimes scheduled.</p>'; return; }
        list.innerHTML = res.data.map(show => `
          <div onclick="openSeats('${show._id}', '${show.time}', ${show.priceGHS})" class="bg-gray-800 p-3 rounded-lg flex justify-between items-center border border-gray-600 cursor-pointer hover:border-amber-400 transition">
            <div><p class="font-bold">${show.date}</p><p class="text-sm text-gray-300">${show.time}</p></div>
            <div class="text-right"><p class="text-amber-400 font-bold">${show.priceGHS} XAF</p></div>
          </div>
        `).join('');
      } catch (err) { list.innerHTML = '<p class="text-red-400">Error loading showtimes.</p>'; }
    }

    async function openSeats(showtimeId, time, price) {
      closeModal('showtimeModal');
      currentShowtimeId = showtimeId;
      currentPrice = price;
      selectedSeats = [];
      updateSeatUI();
      document.getElementById('seatModalTitle').innerText = `Select Seats (${time})`;
      document.getElementById('seatModalPrice').innerText = `${price} XAF per seat`;
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '<p class="text-gray-400 col-span-10 text-center">Loading seats...</p>';
      openModal('seatModal');
      try {
        const res = await axios.get(`${API_URL}/showtimes/${showtimeId}/booked-seats`);
        const bookedSeats = res.data;
        let seatHtml = '';
        const rows = ['A', 'B', 'C', 'D', 'E'];
        rows.forEach(row => {
          for (let i = 1; i <= 10; i++) {
            const seatId = `${row}${i}`;
            const isBooked = bookedSeats.includes(seatId);
            seatHtml += `<div id="seat-${seatId}" onclick="toggleSeat('${seatId}', ${isBooked})" class="w-8 h-8 rounded-t-lg flex items-center justify-center text-xs font-bold cursor-pointer transition ${isBooked ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gray-500 hover:bg-gray-400 text-black'}">${seatId}</div>`;
          }
        });
        grid.innerHTML = seatHtml;
      } catch (err) { grid.innerHTML = '<p class="text-red-400 col-span-10">Error loading seats.</p>'; }
    }

    function toggleSeat(seatId, isBooked) {
      if (isBooked) return;
      const seatEl = document.getElementById(`seat-${seatId}`);
      if (selectedSeats.includes(seatId)) {
        selectedSeats = selectedSeats.filter(s => s !== seatId);
        seatEl.className = "w-8 h-8 rounded-t-lg flex items-center justify-center text-xs font-bold cursor-pointer transition bg-gray-500 hover:bg-gray-400 text-black";
      } else {
        selectedSeats.push(seatId);
        seatEl.className = "w-8 h-8 rounded-t-lg flex items-center justify-center text-xs font-bold cursor-pointer transition bg-amber-400 text-black";
      }
      updateSeatUI();
    }

    function updateSeatUI() {
      document.getElementById('selectedSeatsText').innerText = selectedSeats.length > 0 ? selectedSeats.join(', ') : 'None';
      document.getElementById('totalPriceText').innerText = `${selectedSeats.length * currentPrice} XAF`;
    }

    async function payWithCamerPay() {
      const name = document.getElementById('custName').value;
      const email = document.getElementById('custEmail').value;
      const phone = document.getElementById('custPhone').value;
      if (selectedSeats.length === 0) return alert('Please select at least one seat.');
      if (!name || !email || !phone) return alert('Please fill in all your details.');

      const btn = document.getElementById('payBtn');
      btn.innerText = "Redirecting...";
      btn.disabled = true;

      try {
        const res = await axios.post(`${API_URL}/payments/initialize`, {
          showtimeId: currentShowtimeId, seats: selectedSeats, name: name, email: email, phone: phone
        });
        
        // Redirect to CamerPay
        window.location.href = res.data.redirect_url;

      } catch (err) {
        alert('Could not initiate payment. Check the phone number and try again.');
        btn.innerText = "Pay with Mobile Money";
        btn.disabled = false;
      }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
  </script>
</body>
</html>
