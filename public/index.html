<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsa Movie Night</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- Header -->
  <header class="bg-[#0A192F] shadow-lg">
    <div class="container mx-auto px-4 py-4">
      <h1 class="text-3xl font-bold">
        <span class="text-white">Samsa</span>
        <span class="text-amber-400">Movie Night</span>
      </h1>
      <p class="text-gray-400 text-sm mt-1">Click a movie to see showtimes</p>
    </div>
  </header>

  <!-- Main content -->
  <main class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6">Now Showing</h2>
    <div id="moviesList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <p class="text-gray-400 col-span-full">Loading...</p>
    </div>
  </main>

  <!-- Modal (Hidden by default) -->
  <div id="showtimeModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
    <div class="bg-[#1F2937] border border-gray-700 rounded-xl max-w-md w-full p-6 relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      
      <h3 id="modalMovieTitle" class="text-2xl font-bold mb-4">Movie Title</h3>
      <h4 class="text-amber-400 font-semibold mb-2">Available Showtimes</h4>
      
      <div id="modalShowtimesList" class="space-y-3">
        <!-- Showtimes go here -->
      </div>
    </div>
  </div>

  <script>
    // Load movies on page start
    async function loadMovies() {
      const container = document.getElementById('moviesList');
      try {
        const res = await axios.get('/api/movies');
        const movies = res.data;

        if (movies.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-12">
              <p class="text-gray-400 text-lg mb-2">No movies yet</p>
              <p class="text-gray-500 text-sm">Add a movie in MongoDB Atlas and refresh.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = movies.map(movie => `
          <div onclick="openShowtimes('${movie._id}', '${movie.title}')" class="bg-[#1F2937] rounded-xl overflow-hidden border border-gray-700 cursor-pointer hover:border-amber-400 transition">
            ${movie.posterUrl
              ? `<img src="${movie.posterUrl}" class="w-full h-64 object-cover" alt="${movie.title}">`
              : `<div class="w-full h-64 bg-gray-800 flex items-center justify-center text-gray-500">No poster</div>`
            }
            <div class="p-4">
              <h3 class="font-bold text-lg">${movie.title}</h3>
              <p class="text-gray-400 text-sm mt-1">${movie.genre || ''}</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-red-400 col-span-full">Could not load movies. Check Render logs.</p>`;
      }
    }

    // Open the pop-up and fetch showtimes
    async function openShowtimes(movieId, movieTitle) {
      document.getElementById('modalMovieTitle').innerText = movieTitle;
      const list = document.getElementById('modalShowtimesList');
      list.innerHTML = '<p class="text-gray-400">Loading...</p>';
      
      // Show the modal
      document.getElementById('showtimeModal').classList.remove('hidden');
      document.getElementById('showtimeModal').classList.add('flex');

      try {
        const res = await axios.get(`/api/movies/${movieId}/showtimes`);
        const showtimes = res.data;

        if (showtimes.length === 0) {
          list.innerHTML = '<p class="text-gray-400">No showtimes scheduled yet.</p>';
          return;
        }

        list.innerHTML = showtimes.map(show => `
          <div class="bg-gray-800 p-3 rounded-lg flex justify-between items-center border border-gray-600">
            <div>
              <p class="font-bold">${show.date}</p>
              <p class="text-sm text-gray-300">${show.time}</p>
            </div>
            <div class="text-right">
              <p class="text-amber-400 font-bold">₵${show.priceGHS}</p>
              <p class="text-xs text-gray-400">${show.availableSeats} seats left</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = '<p class="text-red-400">Error loading showtimes.</p>';
      }
    }

    // Close the pop-up
    function closeModal() {
      document.getElementById('showtimeModal').classList.add('hidden');
      document.getElementById('showtimeModal').classList.remove('flex');
    }

    loadMovies();
  </script>
</body>
</html>
