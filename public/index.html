<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsa Movie Night</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <header class="bg-[#0A192F] shadow-lg">
    <div class="container mx-auto px-4 py-4">
      <h1 class="text-3xl font-bold"><span class="text-white">Samsa</span> <span class="text-amber-400">Movie Night</span></h1>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6">Now Showing</h2>
    <div id="moviesList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <!-- Showtimes Modal -->
  <div id="showtimeModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
    <div class="bg-[#1F2937] border border-gray-700 rounded-xl max-w-md w-full p-6 relative">
      <button onclick="closeModal('showtimeModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      <h3 id="modalMovieTitle" class="text-2xl font-bold mb-4"></h3>
      <div id="modalShowtimesList" class="space-y-3"></div>
    </div>
  </div>

  <!-- Seat & Checkout Modal -->
  <div id="seatModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
    <div class="bg-[#1F2937] border border-gray-700 rounded-xl max-w-2xl w-full p-6 relative max-h-[95vh] overflow-y-auto">
      <button onclick="closeModal('seatModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      
      <h3 id="seatModalTitle" class="text-2xl font-bold mb-1">Select Seats</h3>
      <p id="seatModalPrice" class="text-amber-400 mb-6"></p>

      <div class="w-full h-2 bg-gray-600 rounded mb-8"></div>
      <p class="text-center text-xs text-gray-400 mb-4">SCREEN</p>

      <div id="seatGrid" class="grid grid-cols-10 gap-2 mb-8 justify-center"></div>

      <!-- Customer Details Form -->
      <div class="bg-gray-800 p-4 rounded-lg mb-4 border border-gray-600">
        <h4 class="font-bold mb-2">Your Details</h4>
        <input type="text" id="custName" placeholder="Full Name" class="w-full mb-2 p-2 bg-gray-900 rounded border border-gray-600 text-white">
        <input type="email" id="custEmail" placeholder="Email Address" class="w-full mb-2 p-2 bg-gray-900 rounded border border-gray-600 text-white">
        <input type="tel" id="custPhone" placeholder="MTN/Orange Number (e.g. 6XXXXXXXX)" class="w-full mb-2 p-2 bg-gray-900 rounded border border-gray-600 text-white">
      </div>

      <div class="flex justify-between items-center border-t border-gray-700 pt-4 mb-4">
        <div>
          <p class="text-gray-400 text-sm">Selected Seats:</p>
          <p id="selectedSeatsText" class="font-bold text-lg">None</p>
        </div>
        <div class="text-right">
          <p class="text-gray-400 text-sm">Total:</p>
          <p id="totalPriceText" class="font-bold text-xl text-amber-400">0 XAF</p>
        </div>
      </div>
      
      <button id="payBtn" onclick="payWithCampay()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-lg transition">
        Pay with Mobile Money
      </button>
    </div>
  </div>

  <script>
    let currentShowtimeId = null;
    let currentPrice = 0;
    let selectedSeats = [];
    let pollInterval = null;

    window.addEventListener('load', () => { loadMovies(); });

    async function loadMovies() {
      const container = document.getElementById('moviesList');
      try {
        const res = await axios.get('/api/movies');
        const movies = res.data;
        if (movies.length === 0) { container.innerHTML = `<p class="text-gray-400">No movies yet.</p>`; return; }
        container.innerHTML = movies.map(movie => `
          <div onclick="openShowtimes('${movie._id}', '${movie.title}')" class="bg-[#1F2937] rounded-xl overflow-hidden border border-gray-700 cursor-pointer hover:border-amber-400 transition">
            ${movie.posterUrl ? `<img src="${movie.posterUrl}" class="w-full h-64 object-cover">` : `<div class="w-full h-64 bg-gray-800"></div>`}
            <div class="p-4"><h3 class="font-bold text-lg">${movie.title}</h3></div>
          </div>
        `).join('');
      } catch (err) { container.innerHTML = `<p class="text-red-400">Error loading movies.</p>`; }
    }

    async function openShowtimes(movieId, movieTitle) {
      document.getElementById('modalMovieTitle').innerText = movieTitle;
      const list = document.getElementById('modalShowtimesList');
      list.innerHTML = '<p class="text-gray-400">Loading...</p>';
      openModal('showtimeModal');
      try {
        const res = await axios.get(`/api/movies/${movieId}/showtimes`);
        if (res.data.length === 0) { list.innerHTML = '<p class="text-gray-400">No showtimes scheduled.</p>'; return; }
        list.innerHTML = res.data.map(show => `
          <div onclick="openSeats('${show._id}', '${show.time}', ${show.priceGHS})" class="bg-gray-800 p-3 rounded-lg flex justify-between items-center border border-gray-600 cursor-pointer hover:border-amber-400 transition">
            <div><p class="font-bold">${show.date}</p><p class="text-sm text-gray-300">${show.time}</p></div>
            <div class="text-right"><p class="text-amber-400 font-bold">${show.priceGHS} XAF</p></div>
          </div>
        `).join('');
      } catch (err) { list.innerHTML = '<p class="text-red-400">Error loading showtimes.</p>'; }
    }

    async function openSeats(showtimeId, time, price) {
      closeModal('showtimeModal');
      currentShowtimeId = showtimeId;
      currentPrice = price;
      selectedSeats = [];
      updateSeatUI();
      document.getElementById('seatModalTitle').innerText = `Select Seats (${time})`;
      document.getElementById('seatModalPrice').innerText = `${price} XAF per seat`;
      const grid = document.getElementById('seatGrid');
      grid.innerHTML = '<p class="text-gray-400 col-span-10 text-center">Loading seats...</p>';
      openModal('seatModal');
      try {
        const res = await axios.get(`/api/showtimes/${showtimeId}/booked-seats`);
        const bookedSeats = res.data;
        let seatHtml = '';
        const rows = ['A', 'B', 'C', 'D', 'E'];
        rows.forEach(row => {
          for (let i = 1; i <= 10; i++) {
            const seatId = `${row}${i}`;
            const isBooked = bookedSeats.includes(seatId);
            seatHtml += `<div id="seat-${seatId}" onclick="toggleSeat('${seatId}', ${isBooked})" class="w-8 h-8 rounded-t-lg flex items-center justify-center text-xs font-bold cursor-pointer transition ${isBooked ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gray-500 hover:bg-gray-400 text-black'}">${seatId}</div>`;
          }
        });
        grid.innerHTML = seatHtml;
      } catch (err) { grid.innerHTML = '<p class="text-red-400 col-span-10">Error loading seats.</p>'; }
    }

    function toggleSeat(seatId, isBooked) {
      if (isBooked) return;
      const seatEl = document.getElementById(`seat-${seatId}`);
      if (selectedSeats.includes(seatId)) {
        selectedSeats = selectedSeats.filter(s => s !== seatId);
        seatEl.className = "w-8 h-8 rounded-t-lg flex items-center justify-center text-xs font-bold cursor-pointer transition bg-gray-500 hover:bg-gray-400 text-black";
      } else {
        selectedSeats.push(seatId);
        seatEl.className = "w-8 h-8 rounded-t-lg flex items-center justify-center text-xs font-bold cursor-pointer transition bg-amber-400 text-black";
      }
      updateSeatUI();
    }

    function updateSeatUI() {
      document.getElementById('selectedSeatsText').innerText = selectedSeats.length > 0 ? selectedSeats.join(', ') : 'None';
      document.getElementById('totalPriceText').innerText = `${selectedSeats.length * currentPrice} XAF`;
    }

    async function payWithCampay() {
      const name = document.getElementById('custName').value;
      const email = document.getElementById('custEmail').value;
      const phone = document.getElementById('custPhone').value;

      if (selectedSeats.length === 0) return alert('Please select at least one seat.');
      if (!name || !email || !phone) return alert('Please fill in all your details.');

      const btn = document.getElementById('payBtn');
      btn.innerText = "Sending Prompt...";
      btn.disabled = true;

      try {
        const res = await axios.post('/api/payments/initialize', {
          showtimeId: currentShowtimeId, seats: selectedSeats, name: name, email: email, phone: phone
        });

        // Show the user that the prompt was sent
        btn.innerText = "Check your phone (Enter PIN)";
        
        // Start polling to check if they completed the payment
        startPolling(res.data.bookingId);

      } catch (err) {
        alert('Could not send prompt. Check the phone number and try again.');
        btn.innerText = "Pay with Mobile Money";
        btn.disabled = false;
      }
    }

    function startPolling(bookingId) {
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        try {
          const res = await axios.get(`/api/payments/verify/${bookingId}`);
          
          if (res.data.status === 'success') {
            clearInterval(pollInterval);
            alert('🎉 Payment Successful! Your tickets are confirmed.');
            closeModal('seatModal');
            window.location.reload(); // Refresh to show seats as booked
          } else if (res.data.status === 'failed') {
            clearInterval(pollInterval);
            alert('❌ Payment failed or was cancelled.');
            const btn = document.getElementById('payBtn');
            btn.innerText = "Pay with Mobile Money";
            btn.disabled = false;
          }
          // If status is 'pending', we just keep waiting
        } catch (err) {
          console.error("Polling error", err);
        }
      }, 5000); // Check every 5 seconds
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { 
      document.getElementById(id).classList.add('hidden'); 
      document.getElementById(id).classList.remove('flex'); 
      if (pollInterval) clearInterval(pollInterval);
    }
  </script>
</body>
</html>
