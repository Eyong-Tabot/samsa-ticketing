<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samsa Movie Night</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- HEADER -->
  <header class="bg-[#0A192F] shadow-lg">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 onclick="window.location.hash = ''; location.reload()" class="text-3xl font-bold cursor-pointer">
        <span class="text-white">Samsa</span> <span class="text-amber-400">Movie Night</span>
      </h1>
      <button onclick="window.location.hash = 'admin'" class="text-sm bg-gray-800 px-3 py-1 rounded border border-gray-600 hover:bg-gray-700">Admin Area</button>
    </div>
  </header>

  <!-- CUSTOMER VIEW -->
  <main id="customerView" class="container mx-auto px-4 py-8 hidden">
    <h2 class="text-2xl font-bold mb-6">Now Showing</h2>
    <div id="moviesList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <!-- ADMIN VIEW -->
  <main id="adminView" class="container mx-auto px-4 py-8 hidden">
    <div class="max-w-2xl mx-auto">
      <h2 class="text-3xl font-bold text-amber-400 mb-6">Admin Dashboard</h2>
      
      <!-- Login Form -->
      <div id="adminLogin" class="bg-[#1F2937] p-6 rounded-xl border border-gray-700">
        <h3 class="text-xl font-bold mb-4">Enter Admin Password</h3>
        <input type="password" id="adminPassword" placeholder="Password" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-600 text-white">
        <button onclick="loginAdmin()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-lg">Login</button>
      </div>

      <!-- Admin Controls -->
      <div id="adminControls" class="hidden space-y-6">
        <button onclick="logoutAdmin()" class="text-red-400 hover:text-red-300 text-sm">Logout</button>

        <!-- Add Movie Form -->
        <div class="bg-[#1F2937] p-6 rounded-xl border border-gray-700">
          <h3 class="text-xl font-bold mb-4">Add New Movie</h3>
          <input type="text" id="mTitle" placeholder="Movie Title (e.g. Deadpool)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <input type="text" id="mPoster" placeholder="Poster URL (Optional)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <input type="text" id="mGenre" placeholder="Genre (e.g. Action)" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <button onclick="addMovie()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg">Save Movie</button>
        </div>

        <!-- Add Showtime Form -->
        <div class="bg-[#1F2937] p-6 rounded-xl border border-gray-700">
          <h3 class="text-xl font-bold mb-4">Add Showtime</h3>
          <select id="sMovieId" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
            <option value="">Select a Movie</option>
          </select>
          <input type="text" id="sDate" placeholder="Date (e.g. Friday, Nov 15)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <input type="text" id="sTime" placeholder="Time (e.g. 7:00 PM)" class="w-full mb-2 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <input type="number" id="sPrice" placeholder="Price (XAF, max 25 for testing)" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-600 text-white">
          <button onclick="addShowtime()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded-lg">Save Showtime</button>
        </div>
      </div>
    </div>
  </main>

  <!-- SHOWTIMES MODAL -->
  <div id="showtimeModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-50">
    <div class="bg-[#1F2937] border border-gray-700 rounded-xl max-w-md w-full p-6 relative">
      <button onclick="closeModal('showtimeModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
      <h3 id="modalMovieTitle" class="text-2xl font-bold mb-4"></h3>
      <div id="modalShowtimesList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    let adminPass = localStorage.getItem('samsaAdminPass');
    let currentShowtimeId = null;
    let currentPrice = 0;
    let selectedSeats = [];

    // --- ROUTING LOGIC ---
    window.addEventListener('load', () => {
      if (window.location.hash === '#admin') {
        document.getElementById('customerView').classList.add('hidden');
        document.getElementById('adminView').classList.remove('hidden');
        if (adminPass) {
          document.getElementById('adminLogin').classList.add('hidden');
          document.getElementById('adminControls').classList.remove('hidden');
          loadAdminData();
        }
      } else {
        document.getElementById('adminView').classList.add('hidden');
        document.getElementById('customerView').classList.remove('hidden');
        loadMovies();
      }
    });

    // --- ADMIN LOGIC ---
    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (!pass) return alert('Enter password');
      adminPass = pass;
      localStorage.setItem('samsaAdminPass', adminPass);
      document.getElementById('adminLogin').classList.add('hidden');
      document.getElementById('adminControls').classList.remove('hidden');
      loadAdminData();
    }

    function logoutAdmin() {
      localStorage.removeItem('samsaAdminPass');
      window.location.reload();
    }

    async function loadAdminData() {
      try {
        const res = await axios.get(`${API_URL}/movies`);
        const movies = res.data;
        const select = document.getElementById('sMovieId');
        select.innerHTML = '<option value="">Select a Movie</option>' + movies.map(m => `<option value="${m._id}">${m.title}</option>`).join('');
      } catch (err) { console.log(err); }
    }

    async function addMovie() {
      const title = document.getElementById('mTitle').value;
      const posterUrl = document.getElementById('mPoster').value;
      const genre = document.getElementById('mGenre').value;
      if (!title) return alert('Title is required');

      try {
        await axios.post(`${API_URL}/admin/movies`, 
          { title, posterUrl, genre },
          { headers: { Authorization: adminPass } }
        );
        alert('Movie added successfully!');
        document.getElementById('mTitle').value = '';
        document.getElementById('mPoster').value = '';
        document.getElementById('mGenre').value = '';
        loadAdminData();
      } catch (err) { alert('Error: Wrong password or server issue.'); }
    }

    async function addShowtime() {
      const movieId = document.getElementById('sMovieId').value;
      const date = document.getElementById('sDate').value;
      const time = document.getElementById('sTime').value;
      const priceGHS = document.getElementById('sPrice').value;
      if (!movieId || !date || !time || !priceGHS) return alert('Fill all fields');

      try {
        await axios.post(`${API_URL}/admin/showtimes`, 
          { movieId, date, time, priceGHS },
          { headers: { Authorization: adminPass } }
        );
        alert('Showtime added successfully!');
        document.getElementById('sDate').value = '';
        document.getElementById('sTime').value = '';
        document.getElementById('sPrice').value = '';
      } catch (err) { alert('Error: Wrong password or server issue.'); }
    }

    // --- CUSTOMER LOGIC ---
    async function loadMovies() {
      const container = document.getElementById('moviesList');
      try {
        const res = await axios.get(`${API_URL}/movies`);
        const movies = res.data;
        if (movies.length === 0) { container.innerHTML = `<p class="text-gray-400">No movies yet.</p>`; return; }
        container.innerHTML = movies.map(movie => `
          <div onclick="openShowtimes('${movie._id}', '${movie.title}')" class="bg-[#1F2937] rounded-xl overflow-hidden border border-gray-700 cursor-pointer hover:border-amber-400 transition">
            ${movie.posterUrl ? `<img src="${movie.posterUrl}" class="w-full h-64 object-cover">` : `<div class="w-full h-64 bg-gray-800 flex items-center justify-center text-gray-500">No Poster</div>`}
            <div class="p-4"><h3 class="font-bold text-lg">${movie.title}</h3><p class="text-gray-400 text-sm">${movie.genre || ''}</p></div>
          </div>
        `).join('');
      } catch (err) { container.innerHTML = `<p class="text-red-400">Error loading movies.</p>`; }
    }

    async function openShowtimes(movieId, movieTitle) {
      document.getElementById('modalMovieTitle').innerText = movieTitle;
      const list = document.getElementById('modalShowtimesList');
      list.innerHTML = '<p class="text-gray-400">Loading...</p>';
      openModal('showtimeModal');
      try {
        const res = await axios.get(`${API_URL}/movies/${movieId}/showtimes`);
        if (res.data.length === 0) { list.innerHTML = '<p class="text-gray-400">No showtimes scheduled.</p>'; return; }
        list.innerHTML = res.data.map(show => `
          <div onclick="openSeats('${show._id}', '${show.time}', ${show.priceGHS})" class="bg-gray-800 p-3 rounded-lg flex justify-between items-center border border-gray-600 cursor-pointer hover:border-amber-400 transition">
            <div><p class="font-bold">${show.date}</p><p class="text-sm text-gray-300">${show.time}</p></div>
            <div class="text-right"><p class="text-amber-400 font-bold">${show.priceGHS} XAF</p></div>
          </div>
        `).join('');
      } catch (err) { list.innerHTML = '<p class="text-red-400">Error loading showtimes.</p>'; }
    }

    // Note: I've kept the Seat Selection and Payment UI out of this snippet to save space, 
    // but the full version will be provided in the final code block.
    // If you are testing Day 6, you can just use the Admin panel to add movies/showtimes!

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
  </script>
</body>
</html>
